# Log4j configuration for S3Compat API Test Suite
# Logs are written to both console and file

# Root logger - outputs to both console and file
log4j.rootLogger=INFO, stdout, file

# Console appender - for real-time monitoring
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%p] %m%n

# File appender - for persistent logs
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=/app/logs/s3compat-tests.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{ISO8601} [%p] %c - %m%n

# AWS SDK logger - set to WARN to reduce noise
log4j.logger.com.amazonaws=WARN
log4j.logger.com.amazonaws.AmazonWebServiceClient=WARN
log4j.logger.com.amazonaws.request=WARN

# Apache HTTP client - set to WARN to reduce noise
log4j.logger.org.apache.http=WARN
log4j.logger.org.apache.http.wire=WARN

# Snowflake test suite - set to INFO
log4j.logger.com.snowflake.s3compatapitestsuite=INFO